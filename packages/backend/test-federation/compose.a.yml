services:
  a.test:
    extends:
      file: ./compose.tpl.yml
      service: nginx
    depends_on:
      cherrypick.a.test:
        condition: service_healthy
    networks:
      - internal_network_a
    volumes:
      - type: bind
        source: ./.config/a.test.conf
        target: /etc/nginx/conf.d/a.test.conf
        read_only: true
      - type: bind
        source: ./certificates/a.test.crt
        target: /etc/nginx/certificates/a.test.crt
        read_only: true
      - type: bind
        source: ./certificates/a.test.key
        target: /etc/nginx/certificates/a.test.key
        read_only: true

  cherrypick.a.test:
    extends:
      file: ./compose.tpl.yml
      service: cherrypick
    depends_on:
      db.a.test:
        condition: service_healthy
      redis.test:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
      livekit.a.test:
        condition: service_healthy
    networks:
      - internal_network_a
    volumes:
      - type: bind
        source: ./.config/a.test.config.json
        target: /cherrypick/built/._config_.json
        read_only: true

  # a.test の通話 (voiceCall.livekit) が使う LiveKit。setup.sh が a.test.config.json に同じ鍵を書く。
  # b.test には LiveKit を置かず、通話に対応していないサーバーとして扱う
  livekit.a.test:
    image: livekit/livekit-server:v1.13.10
    environment:
      # テスト専用の鍵。外に出ない内部ネットワークでだけ使う
      LIVEKIT_CONFIG: |
        port: 7880
        keys:
          cherrypick: test-federation-livekit-secret-0123456789
    networks:
      - internal_network_a
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1:7880/
      interval: 5s
      retries: 20

  db.a.test:
    extends:
      file: ./compose.tpl.yml
      service: db
    networks:
      - internal_network_a
    volumes:
      - type: bind
        source: ./volumes/db.a
        target: /var/lib/postgresql
        bind:
          create_host_path: true

networks:
  internal_network_a:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          ip_range: 172.21.0.0/24

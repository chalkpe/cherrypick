name: Publish Docker image (develop / beta / release)

on:
  push:
    branches:
      - develop
      - beta
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. 2026.10.0+choco.1). Leave empty to build the selected branch'
        required: false

env:
  REGISTRY_IMAGE: ghcr.io/chalkpe/cherrypick

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.repository == 'chalkpe/cherrypick' && (github.event_name == 'release' || inputs.tag != '' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta')
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
      tags: ${{ steps.target.outputs.tags }}
      release: ${{ steps.target.outputs.release }}
      skip: ${{ steps.target.outputs.skip }}
    steps:
      - name: Resolve build target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            ref="refs/tags/$INPUT_TAG"
            name="$INPUT_TAG"
          else
            ref="$REF"
            name="$REF_NAME"
          fi
          base="${name%%+*}"
          {
            echo "ref=$ref"
            echo "tag=$base"
            echo "version=$name"
            case "$ref" in
              refs/tags/*) echo "release=$name" ;;
            esac
          } >> "$GITHUB_OUTPUT"

          if [ "$name" = "$base" ]; then
            echo "tags=$name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Docker tags cannot contain '+', so 2026.10.0+choco.1 is pinned as 2026.10.0_choco.1 (same mapping as Helm OCI charts)
          pinned="${name//+/_}"
          if out=$(docker buildx imagetools inspect "$REGISTRY_IMAGE:$pinned" 2>&1); then
            echo "::notice::$REGISTRY_IMAGE:$pinned is already published; pinned tags are never rebuilt"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q 'not found' <<< "$out"; then
            echo "$out" >&2
            exit 1
          fi

          # 2026.10.0 follows the newest +choco.N release, so rebuilding an older one must not move it back
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')
          newest=$(awk -v prefix="$base+" 'index($0, prefix) == 1' <<< "$releases" | sort -V | tail -n 1)
          if [ "$newest" = "$name" ]; then
            echo "tags=$pinned $base" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$pinned" >> "$GITHUB_OUTPUT"
          fi

  # see https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space
        # Pin third-party actions to a commit SHA: this job can push packages.
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        with:
          # This might remove tools that are actually needed, if set to "true" but frees about 6 GB
          tool-cache: false
          # All of these default to true, but feel free to set to "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Check out the repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: |
            org.opencontainers.image.ref.name=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          args=()
          for tag in $TAGS; do
            args+=(--tag "$REGISTRY_IMAGE:$tag")
          done
          docker buildx imagetools create "${args[@]}" \
            $(printf "$REGISTRY_IMAGE@sha256:%s " *)
      - name: Inspect image
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          docker buildx imagetools inspect "$REGISTRY_IMAGE:${TAGS%% *}"
      - name: Add image digest to release notes
        if: needs.prepare.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.prepare.outputs.release }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          image="$REGISTRY_IMAGE:${TAGS%% *}"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
          if ! notes=$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json body --jq .body); then
            echo "::notice::No GitHub release for $RELEASE; skipping release notes"
            exit 0
          fi
          if grep -qF "$digest" <<< "$notes"; then
            exit 0
          fi
          printf '%s\n\n### Docker 이미지\n- `%s`\n- `%s@%s`\n' "$notes" "$image" "$REGISTRY_IMAGE" "$digest" > "$RUNNER_TEMP/notes.md"
          gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

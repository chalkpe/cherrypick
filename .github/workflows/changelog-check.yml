name: Check the description in CHANGELOG_CHERRYPICK.md

on:
  pull_request:
    branches:
      - master
      - develop

jobs:
  check-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages-private/changelog-checker/package.json

      - name: Checkout base
        run: |
          mkdir _base
          cp -r .git _base/.git
          cd _base
          git fetch --depth 1 origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }} CHANGELOG_CHERRYPICK.md

      - name: Copy to Checker directory for CHANGELOG_CHERRYPICK-base.md
        run: cp _base/CHANGELOG_CHERRYPICK.md packages-private/changelog-checker/CHANGELOG_CHERRYPICK-base.md
      - name: Copy to Checker directory for CHANGELOG_CHERRYPICK-head.md
        run: cp CHANGELOG_CHERRYPICK.md packages-private/changelog-checker/CHANGELOG_CHERRYPICK-head.md
      - name: diff
        continue-on-error: true
        run: diff -u CHANGELOG_CHERRYPICK-base.md CHANGELOG_CHERRYPICK-head.md
        working-directory: packages-private/changelog-checker

      - name: Install dependencies
        run: pnpm --filter changelog-checker... install --frozen-lockfile

      - name: Run Checker
        run: pnpm --filter changelog-checker check

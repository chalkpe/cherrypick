name: Test (frontend)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/frontend/**
      # for permissions
      - packages/cherrypick-js/**
      # for e2e
      - packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/cherrypick/test.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages/frontend/**
      # for permissions
      - packages/cherrypick-js/**
      # for e2e
      - packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/cherrypick/test.yml
  workflow_dispatch:
jobs:
  vitest:
    name: Unit tests (frontend)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.10
    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Check pnpm-lock.yaml
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy Configure
      run: cp .github/cherrypick/test.yml .config
    - name: Build
      run: pnpm build
    - name: Test
      run: pnpm --filter frontend test-and-coverage
    - name: Upload Coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/frontend/coverage/coverage-final.json

  e2e:
    name: E2E tests (frontend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        ports:
          - 5432
        env:
          POSTGRES_DB: test-cherrypick
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 6379

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.10
    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Copy Configure
      env:
        POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
      run: |
        node --input-type=module <<'NODE'
        import { readFileSync, writeFileSync } from 'node:fs';
        import { load, dump } from 'js-yaml';

        const config = load(readFileSync('.github/cherrypick/test.yml', 'utf8'));
        config.db.port = Number(process.env.POSTGRES_PORT);
        config.redis.port = Number(process.env.REDIS_PORT);
        writeFileSync('.config/test.yml', dump(config));
        NODE
    - name: Build
      run: pnpm build
    - name: Playwright install
      working-directory: packages/frontend
      run: pnpm exec playwright install --with-deps chromium
    - name: Test
      run: pnpm start-server-and-test "pnpm --filter backend start:test" http://localhost:61812 "pnpm --filter frontend test:e2e"
      timeout-minutes: 15
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-e2e-artifacts
        path: packages/frontend/test/e2e/artifacts

name: Report API Diff

on:
  workflow_run:
    types: [completed]
    workflows:
      - Get api.json from CherryPick # get-api-diff.yml

jobs:
  compare-diff:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      pull-requests: write

# api-artifact
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: api-artifact-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check artifacts
        run: ls -lh artifacts/
      - name: Load PR Number
        id: load-pr-num
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          match = re.fullmatch(rb'([1-9][0-9]*)\n?', Path('artifacts/pr_number').read_bytes())
          if match is None:
              raise SystemExit('Invalid PR number in artifact.')

          with open(os.environ['GITHUB_OUTPUT'], 'ab') as output:
              output.write(b'pr-number=' + match[1] + b'\n')

      - name: Arrange json files
        run: |
          jq '.' ./artifacts/api-base.json > ./api-base.json
          jq '.' ./artifacts/api-head.json > ./api-head.json
      - name: Get diff of 2 files
        run: |
          diff_status=0
          {
            diff -u --label=base --label=head ./api-base.json ./api-head.json || diff_status=$?
          } > api.json.diff
          if [ "$diff_status" -gt 1 ]; then
            exit "$diff_status"
          fi
      - name: Get full diff
        run: |
          diff_status=0
          {
            diff --label=base --label=head \
              --new-line-format='+%L' --old-line-format='-%L' --unchanged-line-format=' %L' \
              ./api-base.json ./api-head.json || diff_status=$?
          } > api-full.json.diff
          if [ "$diff_status" -gt 1 ]; then
            exit "$diff_status"
          fi
      - name: Upload full diff to Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-artifact
          path: |
            api-full.json.diff
            api-base.json
            api-head.json
      - id: out-diff
        name: Build diff Comment
        run: |
          HEADER="이 PR에 의한 api.json 차이"
          FOOTER="[Get diff files from Workflow Page](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          DIFF_BYTES="$(stat ./api.json.diff -c '%s' | tr -d '\n')"

          echo "$HEADER" > ./output.md

          if (( "$DIFF_BYTES" <= 1 )); then
            echo '차이점이 없습니다.' >> ./output.md
          else
            echo '<details>' >> ./output.md
            echo '<summary>차이점은 여기에서 볼 수 있음</summary>' >> ./output.md
            echo >> ./output.md
            echo '```diff' >> ./output.md
            cat ./api.json.diff >> ./output.md
            echo '```' >> ./output.md
            echo '</details>' >> ./output.md
          fi

          echo "$FOOTER" >> ./output.md
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          pr-number: ${{ steps.load-pr-num.outputs.pr-number }}
          comment-tag: show_diff
          file-path: ./output.md
      - name: Tell error to PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        if: failure() && steps.load-pr-num.outputs.pr-number
        with:
          pr-number: ${{ steps.load-pr-num.outputs.pr-number }}
          comment-tag: show_diff_error
          message: |
            api.json 간 차이점을 생성하는 도중 오류가 발생했습니다. 자세한 내용은 [Workflow 로그](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})를 확인해 주세요.

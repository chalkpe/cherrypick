name: ✨ 기능 요청 (한국어)
description: 새로운 기능이나 개선 아이디어를 한국어로 제안해주세요
labels: ["✨Feature"]

body:
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 제안하는 기능이나 개선 사항을 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 이 기능이 해결할 구체적인 문제나 필요와 누구에게 도움이 되는지 설명해주세요.
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: 직접 구현에 참여하고 싶으신가요?
      options:
        - label: 직접 기능을 구현하고 Pull Request를 보내고 싶습니다.
